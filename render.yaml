services:
  - type: web
    name: distance-risk-pricing-api
    runtime: python
    plan: free
    buildCommand: uv sync --no-dev
    startCommand: uv run --no-dev uvicorn services.api_gateway.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LOCATION_CATALOG_PATH
        value: "data/FUTO Route Endpoint Coordinate Collection.csv"
      - key: ROUTING_BASE_URL
        value: https://router.project-osrm.org
      - key: ROUTING_TIMEOUT_SECONDS
        value: "10"
      - key: ROUTING_RETRIES
        value: "2"
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "10"
      - key: PROVIDER_RETRIES
        value: "2"
      - key: RISK_MODE
        value: futo_survey
      - key: RISK_SURVEY_PROFILE_PATH
        value: data/processed/futo_route_risk_profile.csv
      - key: RISK_SURVEY_TIMEZONE
        value: Africa/Lagos
      - key: RISK_PROVIDER_URL
        sync: false
      - key: RISK_PROVIDER_API_KEY
        sync: false
      - key: DEMAND_MODE
        value: time_of_day
      - key: DEMAND_TIMEZONE
        value: Africa/Lagos
      - key: DEMAND_SIMULATED_REQUESTS
        value: "100"
      - key: DEMAND_SIMULATED_DRIVERS
        value: "100"
      - key: ALLOW_SIMULATED_DATA
        value: "true"
      - key: API_AUTH_ENABLED
        value: "true"
      - key: API_KEY
        sync: false
      - key: RATE_LIMIT_REQUESTS
        value: "120"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: PRICING_FORMULA_MODE
        value: additive
      - key: PRICING_FORMULA_VERSION
        value: v2-distance-base
