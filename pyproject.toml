[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distance-risk-pricing"
version = "0.1.0"
description = "Distance-risk-aware dynamic pricing research prototype"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.14.1",
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "psycopg[binary]==3.2.3",
  "python-dotenv==1.0.1",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "ruff==0.9.2",
]

[tool.setuptools.packages.find]
include = ["database*", "services*", "packages*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests", "services", "ml/tests"]
pythonpath = [".", "services/api_gateway", "services/pricing_engine", "services/risk_service", "services/demand_service", "services/routing_service"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["database/migrations/versions", ".venv", ".uv-cache", ".uv-python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
